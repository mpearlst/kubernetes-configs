# talhelper config - source of truth for the Talos OS and Kubernetes versions.
#
# talosVersion/kubernetesVersion are watched by Renovate (see .github/renovate.json)
# so version bumps show up as PRs instead of drifting silently. Merging a bump PR
# does NOT upgrade anything by itself - see the "Upgrading Talos & Kubernetes"
# section in the README for the manual runbook.
#
# IMPORTANT: before merging this file for the first time, set talosVersion and
# kubernetesVersion below to whatever the cluster is ACTUALLY running today, so
# the first Renovate diff reflects a real upgrade rather than a fabricated jump.
clusterName: funland
talosVersion: v1.13.8
kubernetesVersion: v1.36.3
endpoint: https://192.168.10.20:6443
allowSchedulingOnControlPlanes: false

nodes:
  - hostname: talos-g4c-g4l
    ipAddress: 192.168.10.20
    controlPlane: true
    installDisk: /dev/sda
  - hostname: talos-worker1
    ipAddress: 192.168.10.21
    controlPlane: false
    installDisk: /dev/sda
  - hostname: talos-worker2
    ipAddress: 192.168.10.22
    controlPlane: false
    installDisk: /dev/sda
  - hostname: talos-worker3
    ipAddress: 192.168.10.23
    controlPlane: false
    installDisk: /dev/sda

# Reproduces the existing bootstrap patch from the README (disable the default
# CNI and kube-proxy so Cilium can replace both).
patches:
  - |-
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
  # Node-level resource reservations.
  #
  # Context: on 2026-08-23 the cluster was flapping nodes NotReady. Root cause
  # was that most chart-deployed workloads declared no memory requests, so the
  # scheduler saw talos-worker2 as 7% full while it was actually 71% full,
  # packed 53 pods onto it, and the kernel OOM killer fired 153 times in 7 days.
  #
  # Requests have since been set across the repo, but that fix is not complete
  # on its own: Longhorn creates its instance-manager, csi-* and engine-image
  # pods itself rather than through Helm, and the chart exposes no memory
  # requests for them (see funland/longhorn-system/longhorn/application.yaml).
  # Roughly 25 pods will therefore always be invisible to the scheduler.
  #
  # These reservations are what protect the node in that case. They hold back
  # memory for the kubelet and system daemons, and evictionHard makes the
  # kubelet evict pods BEFORE the kernel OOM killer runs - an eviction is
  # graceful and shows up as a Kubernetes event, an OOM kill is neither.
  #
  # NOTE: this must be a `patches` entry (raw Talos machine config), NOT a
  # top-level `machine:` key - talhelper has no such key and silently ignores
  # unrecognized ones, the same trap noted for `schematic` below.
  #
  # Applying this needs the manual runbook in README.md ("Upgrading Talos &
  # Kubernetes"): talhelper genconfig, then talosctl apply-config node by node.
  - |-
    machine:
      kubelet:
        extraConfig:
          systemReserved:
            cpu: 200m
            memory: 512Mi
          kubeReserved:
            cpu: 200m
            memory: 512Mi
          evictionHard:
            memory.available: "500Mi"
            nodefs.available: "10%"

# Longhorn requires these Talos system extensions on every node (control plane
# included, so Longhorn's manager/CSI components run cluster-wide even though
# workloads themselves won't be scheduled on the control plane), plus
# qemu-guest-agent since every node is a QEMU VM. talhelper resolves this into
# a schematic ID via the Talos Image Factory automatically when running
# `talhelper genconfig` - no manual schematic lookup needed.
#
# NOTE: this must live under controlPlane/worker (or per-node), NOT as a
# top-level `schematic:` key - talhelper's config schema doesn't have a
# top-level schematic field, and silently ignores unrecognized keys instead
# of erroring, which is what happened here originally.
controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          - siderolabs/qemu-guest-agent

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
          - siderolabs/qemu-guest-agent
