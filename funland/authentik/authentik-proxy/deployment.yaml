apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-proxy
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-proxy
    app.kubernetes.io/instance: authentik-proxy
    # renovate: image=goauthentik/proxy
    app.kubernetes.io/version: "2026.5.6"
    app.kubernetes.io/component: sso-proxy
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-proxy
      app.kubernetes.io/instance: authentik-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-proxy
        app.kubernetes.io/instance: authentik-proxy
        # renovate: image=goauthentik/proxy
        app.kubernetes.io/version: "2026.5.6"
        app.kubernetes.io/component: sso-proxy
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsNonRoot: true
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: ghcr.io/goauthentik/proxy:2026.8.0
          env:
            # Same Service name/port already used by
            # funland/authentik/authentik/http-route.yaml's backendRefs
            # (name: authentik-application-server, port: 80) — keep these in sync.
            - name: AUTHENTIK_HOST
              value: "http://authentik-application-server.authentik.svc.cluster.local:80"
            # Browser-facing redirects must use the public hostname (matches
            # that same HTTPRoute's hostnames entry), not the internal Service name.
            - name: AUTHENTIK_HOST_BROWSER
              value: "https://auth.batlab.io"
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-proxy-secret
                  key: token
          ports:
            - containerPort: 9000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-proxy
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-proxy
    app.kubernetes.io/instance: authentik-proxy
    # renovate: image=goauthentik/proxy
    app.kubernetes.io/version: "2026.5.6"
    app.kubernetes.io/component: sso-proxy
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: authentik-proxy
    app.kubernetes.io/instance: authentik-proxy
  ports:
    - port: 9000
      targetPort: 9000
