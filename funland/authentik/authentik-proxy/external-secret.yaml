apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-proxy-secret
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: authentik-proxy-outpost
        property: token
