apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-sso
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: argocd-sso
        property: argocd_client_id
    - secretKey: client_secret
      remoteRef:
        key: argocd-sso
        property: argocd_client_secret
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-application
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.6.0
    helm:
      valuesObject:
        global:
          domain: argocd.batlab.io
          # All ArgoCD components ended up scheduled on a single node
          # (talos-worker2); when that node hit a System OOM and flapped
          # NotReady, the entire GitOps control plane went unreachable at
          # once (repo-server, controller, redis, server all co-located).
          # Every component is single-replica here, so the chart's own
          # podAntiAffinity presets (which only spread replicas of the same
          # component) don't help — this spreads distinct components across
          # nodes instead, using the shared `part-of: argocd` label. Soft
          # (ScheduleAnyway) since this cluster only has 4 nodes for 7
          # components and pods must never go Pending over this.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: argocd
        configs:
          params:
            server.insecure: true
          cm:
            resource.compareoptions: |
              ignoreAggregatedRoles: true
              ignoreResourceStatusField: crd
            resource.customizations.health.postgresql.cnpg.io_Cluster: |
              hs = {}
              if obj.status ~= nil then
                if obj.status.conditions ~= nil then
                  for i, condition in ipairs(obj.status.conditions) do
                    if condition.type == "Ready" then
                      if condition.status == "True" then
                        hs.status = "Healthy"
                        hs.message = condition.message
                        return hs
                      else
                        hs.status = "Degraded"
                        hs.message = condition.message
                        return hs
                      end
                    end
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for cluster to be ready"
              return hs
            url: "https://argocd.batlab.io"
            dex.config: |
              connectors:
                - type: oidc
                  name: authentik
                  id: authentik
                  config:
                    issuer: https://auth.batlab.io/application/o/argocd/
                    clientID: $argocd-sso:client_id
                    clientSecret: $argocd-sso:client_secret
                    insecureEnableGroups: true
                    scopes:
                      - openid
                      - profile
                      - email
          rbac:
            policy.csv: |
              g, ArgoCD Admin, role:admin
        repoServer:
          rbac:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "watch", "list"]
          # Chart defaults (timeoutSeconds: 1) are too tight for this cluster's
          # hardware and were causing the repo-server to crash-loop on liveness
          # probe timeouts (context deadline exceeded) even though the process
          # itself was healthy. Widen the timeout/period so transient latency
          # doesn't trigger a kill.
          readinessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        # Requests added so the scheduler accounts for these pods. Every ArgoCD
        # component previously declared none, which is how they all ended up on
        # talos-worker2 in the first place - the topologySpreadConstraints above
        # treated the symptom, but a pod with no request still looks free to the
        # scheduler. Sized from measured working set.
        controller:
          resources:
            requests:
              cpu: 250m
              memory: 640Mi
            limits:
              memory: 896Mi
        server:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        # For a non-HA setup, ensure redis.enabled is true (default) or
        # explicitly set it. See the HA notes further down.
        redis:
          enabled: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        # dex peaks around 110Mi at startup, not the ~38Mi steady-state reading
        # the original sizing used. At a 128Mi limit it crashlooped with SIGSEGV
        # (exit 139) rather than a clean OOMKill - Go segfaults when it cannot
        # mmap under cgroup pressure, so this does not show up as OOMKilled and
        # is easy to misread as an application bug.
        dex:
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
        applicationSet:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        notifications:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        deploymentAnnotations:
          reloader.stakater.com/auto: "true"
        # To enable High Availability (HA) for the Argo CD server:
        # 1. Uncomment and adjust the replicaCount.
        # 2. Configure the connection to an external HA Redis cluster under the 'database' section.
        # 3. Ensure 'redis.enabled' is set to 'false'.
        # server:
          # replicaCount: 3
          # database:
          #   host: argocd-redis-ha.argocd-redis-ha.svc
          #   port: 6379
          #   # passwordSecretName: argocd-redis-secret
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true