# Unlike Prowlarr/Radarr/Sonarr, Overseerr is NOT routed through the Authentik
# proxy outpost — it has its own login and is explicitly excluded from SSO.
# Points directly at the local `overseerr` Service on both gateways.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overseerr
  namespace: media
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - "request.batlab.io"
  rules:
    - backendRefs:
        - name: overseerr
          port: 5055
