apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: media
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/instance: recyclarr
    # renovate: image=recyclarr/recyclarr
    app.kubernetes.io/version: "8"
    app.kubernetes.io/component: quality-profile-sync
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
      app.kubernetes.io/instance: recyclarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recyclarr
        app.kubernetes.io/instance: recyclarr
        # renovate: image=recyclarr/recyclarr
        app.kubernetes.io/version: "8"
        app.kubernetes.io/component: quality-profile-sync
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      automountServiceAccountToken: false
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:8
          # No command/args: the image's default entrypoint runs "Cron Mode",
          # staying alive and syncing on CRON_SCHEDULE (no separate k8s CronJob needed).
          env:
            - name: TZ
              value: "America/New_York"
            - name: CRON_SCHEDULE
              value: "@daily"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: recyclarr-yml
              mountPath: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
            - name: recyclarr-secrets
              mountPath: /config/secrets.yml
              subPath: secrets.yml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: recyclarr-config
        - name: recyclarr-yml
          configMap:
            name: recyclarr-yml
        - name: recyclarr-secrets
          secret:
            secretName: recyclarr-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
  volumeMode: Filesystem
