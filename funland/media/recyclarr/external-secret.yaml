apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    template:
      data:
        recyclarr.yml: |-
          radarr:
            radarr-main:
              base_url: http://radarr.media.svc.cluster.local:7878
              api_key: {{ .radarr_api_key | toString }}
              quality_definition:
                type: movie
              # Add custom_formats / quality_profiles here per the TRaSH Guides:
              # https://trash-guides.info/Radarr/
          sonarr:
            sonarr-main:
              base_url: http://sonarr.media.svc.cluster.local:8989
              api_key: {{ .sonarr_api_key | toString }}
              quality_definition:
                type: series
              # Add custom_formats / quality_profiles here per the TRaSH Guides:
              # https://trash-guides.info/Sonarr/
  data:
    - secretKey: radarr_api_key
      remoteRef:
        key: radarr
        property: api_key
    - secretKey: sonarr_api_key
      remoteRef:
        key: sonarr
        property: api_key
