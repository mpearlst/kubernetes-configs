apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn-system
spec:
  cron: "0 3 * * *"
  task: "snapshot"
  groups:
    - default
  retain: 3
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-weekly
  namespace: longhorn-system
spec:
  cron: "0 4 * * 0"
  task: "filesystem-trim"
  groups:
    - default
    # The Prometheus TSDB volume opts out of "default" to avoid daily
    # snapshots (see funland/monitoring/prometheus/application.yaml), which
    # also opted it out of trim: blocks freed by retentionSize were never
    # released and a removed-but-unpurged system snapshot lingered, leaving
    # the 10Gi volume at 182% actual size. It still needs trimming.
    - tsdb-unmanaged
  retain: 0
  concurrency: 2
