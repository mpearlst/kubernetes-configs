apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-rules
  namespace: longhorn-system
  labels:
    # kube-prometheus-stack leaves ruleSelectorNilUsesHelmValues at its default,
    # so the Prometheus CR selects PrometheusRules by `release: <helm release>`.
    # Without this label these rules were never loaded by Prometheus at all -
    # they existed in the cluster but evaluated nowhere.
    release: prometheus-application
    prometheus: longhorn
    role: alert-rules
spec:
  groups:
    - name: longhorn.rules
      rules:
        - alert: LonghornVolumeStatusCritical
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is Faulted"
            description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} has been Faulted for more than 5 minutes."
        - alert: LonghornVolumeStatusWarning
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is Degraded"
            description: "Longhorn volume {{ $labels.volume }} on {{ $labels.node }} has been Degraded for more than 5 minutes."
        - alert: LonghornNodeDown
          # Per-node rather than an aggregate count diff, so the notification can
          # name the node. The previous form subtracted two cluster-wide counts,
          # which left {{ $labels.node }} empty and reported only a bare number.
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} is offline"
            description: "Longhorn node {{ $labels.node }} has been not-ready for more than 5 minutes."
        - alert: LonghornDiskStorageWarning
          expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is over 70% full"
            description: "The used storage of disk {{ $labels.disk }} on node {{ $labels.node }} has been at {{ $value }}% capacity for more than 5 minutes."
        - alert: LonghornVolumeActualSpaceUsedWarning
          expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is over 90% full"
            description: "The actual space used by Longhorn volume {{ $labels.volume }} on {{ $labels.node }} has been at {{ $value }}% capacity for more than 5 minutes."
