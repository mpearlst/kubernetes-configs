apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-application
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /spec/preserveUnknownFields
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.12.1
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
            upgradeVersionCheck: false
          defaultSettings:
            orphanResourceAutoDeletion: replica-data
          metrics:
            serviceMonitor:
              enabled: true
          longhornManager:
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                memory: 320Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system