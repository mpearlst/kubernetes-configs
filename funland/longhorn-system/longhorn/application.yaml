apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-application
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /spec/preserveUnknownFields
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.13.0
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
            upgradeVersionCheck: false
          defaultSettings:
            orphanResourceAutoDeletion: replica-data
            # Must stay false: with true, filesystem-trim-weekly marks every
            # snapshot on a trimmed volume as removed and purges it, so each
            # Sunday 04:00 wiped all of snapshot-daily's restore points
            # (23 of 24 volumes had none on 2026-10-11). Space held by a
            # snapshot is reclaimed when it ages out of retain: 3 instead.
            # The Prometheus TSDB volume opts back in per volume - see
            # funland/monitoring/prometheus/application.yaml.
            removeSnapshotsDuringFilesystemTrim: false
          metrics:
            serviceMonitor:
              enabled: true
          longhornManager:
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                memory: 320Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system