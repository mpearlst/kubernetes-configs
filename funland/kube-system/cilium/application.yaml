apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-application
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cilium
    repoURL: https://helm.cilium.io/
    targetRevision: 1.20.1
    helm:
      valuesObject:
        ipam:
          mode: kubernetes
        # prometheus:
        #   enabled: true
        #   serviceMonitor:
        #     enabled: true
        # operator:
        #   prometheus:
        #     enabled: true
        #     serviceMonitor:
        #       enabled: true
        # hubble:
        #   enabled: true
        #   relay:
        #     enabled: true
        #   ui:
        #     enabled: true
        #   metrics:
        #     enableOpenMetrics: true
        #     serviceMonitor:
        #       enabled: true
        #     enabled:
        #       - dns:query
        #       - drop
        #       - tcp
        #       - flow
        #       - port-distribution
        #       - icmp
        #       - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        #     dashboards:
        #       enabled: true
        #       namespace: monitoring
        # Requests added so the scheduler accounts for these pods (they
        # previously declared none). The agent runs 301-414Mi across the four
        # nodes; the request tracks typical usage and the limit is a cap.
        #
        # The agent limit is set generously on purpose: Cilium is the CNI, and
        # an OOM-kill here takes networking down on the whole node.
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 768Mi
        envoy:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
        operator:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        kubeProxyReplacement: true
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        k8sServiceHost: localhost #Remove for most kubernetes clusters
        k8sServicePort: 7445 #Remove for most kubernetes clusters
        l2announcements:
          enabled: true
        gatewayAPI:
          enabled: true
          externalTrafficPolicy: Local
          secretsNamespace:
            create: false
            name: certificate
        # encryption:
        #   enabled: true
        #   type: wireguard
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true