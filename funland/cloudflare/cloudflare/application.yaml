apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-operator-secret
  namespace: cloudflare
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
  data:
    - secretKey: cloudflare-operator-api-token-secret
      remoteRef:
        key: cloudflare-operator
        property: password
    - secretKey: cloudflare-operator-tunnel-name-secret
      remoteRef:
        key: cloudflare-operator
        property: tunnelName
    - secretKey: cloudflare-operator-account-id-secret
      remoteRef:
        key: cloudflare-operator
        property: accountId
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-operator-application
  namespace: argocd
spec:
  destination:
    namespace: cloudflare
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cloudflare-tunnel-ingress-controller
    repoURL: https://helm.strrl.dev
    targetRevision: 0.1.0
    helm:
      valuesObject:
        cloudflare:
          secretRef:
            name: cloudflare-operator-secret
            accountIDKey: cloudflare-operator-account-id-secret
            tunnelNameKey: cloudflare-operator-tunnel-name-secret
            apiTokenKey: cloudflare-operator-api-token-secret
            #accountId: ""
            #tunnelName: ""
            #apiToken: ""
        cloudflared:
          # The controller itself has chart-default requests; the managed
          # connector pods did not, so the scheduler counted them as free.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          image:
            # Chart 0.1.0 (2026-08-12) switched the connector image default from
            # cloudflare/cloudflared to strrl's fork, which publishes host-metrics
            # builds under its own tag scheme. Renovate was still tracking
            # cloudflare/cloudflared and wrote upstream tags (2026.8.1, 2026.8.2)
            # into this registry, where they do not exist - leaving the connector
            # in ImagePullBackOff since 2026-08-12. ghcr.io/strrl/cloudflared
            # currently publishes only 2026.7.3-host-metrics.1.
            # renovate: datasource=docker depName=ghcr.io/strrl/cloudflared
            tag: 2026.7.3-host-metrics.1
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true