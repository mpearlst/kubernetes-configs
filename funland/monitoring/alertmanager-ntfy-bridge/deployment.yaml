apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-ntfy-bridge
    app.kubernetes.io/instance: alertmanager-ntfy-bridge
    # renovate: image=alexbakker/alertmanager-ntfy
    app.kubernetes.io/version: "1.2.1"
    app.kubernetes.io/component: notification-relay
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy-bridge
      app.kubernetes.io/instance: alertmanager-ntfy-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy-bridge
        app.kubernetes.io/instance: alertmanager-ntfy-bridge
        # renovate: image=alexbakker/alertmanager-ntfy
        app.kubernetes.io/version: "1.2.1"
        app.kubernetes.io/component: notification-relay
        app.kubernetes.io/part-of: homelab
        app.kubernetes.io/managed-by: argocd
    spec:
      # Keep the bridge off whichever node Alertmanager and Prometheus land on.
      # The whole notification path (Prometheus -> Alertmanager -> this bridge
      # -> ntfy) is single-replica and in-cluster, so co-locating any two of
      # them means one node failure silences alerting exactly when it is needed.
      # Soft (preferred) only - 3 schedulable workers, must never go Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["alertmanager", "prometheus"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      automountServiceAccountToken: false
      containers:
      - name: alertmanager-ntfy-bridge
        image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1
        args: ["--configs", "/etc/alertmanager-ntfy/config.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager-ntfy
          readOnly: true
      volumes:
        - name: config
          secret:
            secretName: alertmanager-ntfy-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-ntfy-bridge
    app.kubernetes.io/instance: alertmanager-ntfy-bridge
    # renovate: image=alexbakker/alertmanager-ntfy
    app.kubernetes.io/version: "1.2.1"
    app.kubernetes.io/component: notification-relay
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: alertmanager-ntfy-bridge
    app.kubernetes.io/instance: alertmanager-ntfy-bridge
  ports:
  - port: 8000
    targetPort: 8000
