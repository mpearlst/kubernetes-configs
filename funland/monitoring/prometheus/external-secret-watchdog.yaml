# Dead-man's-switch endpoint for the Watchdog alert.
#
# The entire alert path on this cluster is in-cluster and single-replica
# (Prometheus -> Alertmanager -> alertmanager-ntfy-bridge -> ntfy), so a failure
# of the path itself produces silence rather than a notification. Watchdog fires
# continuously by design; Alertmanager posts it to an EXTERNAL heartbeat service
# which alarms when the pings stop.
#
# The ping URL is a capability secret (anyone holding it can suppress the alarm)
# and this repository is public, so it is stored in 1Password rather than inline.
#
# BOOTSTRAP (must be done before this app syncs, otherwise the Alertmanager pod
# stays in ContainerCreating waiting for the secret to mount):
#   1. Create a check at an external heartbeat service - healthchecks.io,
#      Dead Man's Snitch, or a self-hosted endpoint OUTSIDE this cluster.
#      Set its period to ~10m with a ~20m grace (Watchdog repeats every 5m).
#   2. Create a 1Password item named `alertmanager-watchdog` in the same vault
#      as the other cluster secrets, with a property `url` holding the ping URL.
#   3. Sync this app, then confirm the heartbeat service shows "up".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-watchdog
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: alertmanager-watchdog
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: alertmanager-watchdog
        property: url
