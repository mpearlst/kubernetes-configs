---
kind: Namespace
apiVersion: v1
metadata:
  name: immich
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: "192.168.11.13"
    path: /mnt/tank/immich
  mountOptions:
    - nfsvers=4.2
    - hard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-library-nfs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    creationPolicy: Owner
    template:
      data:
        DB_URL: "postgresql://{{ .immich_db_user }}:{{ .immich_db_password }}@immich-dbc-rw.postgres:5432/immich"
        DB_HOSTNAME: "immich-dbc-rw.postgres"
        DB_PORT: "5432"
        DB_USERNAME: "{{ .immich_db_user | toString }}"
        DB_PASSWORD: "{{ .immich_db_password | toString }}"
        DB_DATABASE_NAME: "immich"
  data:
    - secretKey: immich_db_user
      remoteRef:
        key: immich-db-credentials
        property: username
    - secretKey: immich_db_password
      remoteRef:
        key: immich-db-credentials
        property: password
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-application
  namespace: argocd
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: immich
    repoURL: ghcr.io/immich-app/immich-charts
    targetRevision: 0.13.1
    helm:
      valuesObject:
        env:
          DB_VECTOR_EXTENSION: "vchord"
        controllers:
          main:
            containers:
              main:
                image:
                  # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
                  tag: v3.1.0
                envFrom:
                  - secretRef:
                      name: immich-secret
        # Requests added so the scheduler accounts for these pods (they
        # previously declared none). Set per-component rather than on the shared
        # top-level `controllers` block, since server and machine-learning have
        # very different footprints. Sized from measured working set.
        server:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  # Observed working set ~874Mi - the largest workload pod on
                  # the cluster after kube-apiserver.
                  resources:
                    requests:
                      cpu: 200m
                      memory: 1024Mi
                    limits:
                      memory: 1536Mi
          ingress:
            main:
              enabled: false
        machine-learning:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  # Observed working set ~249Mi.
                  resources:
                    requests:
                      cpu: 100m
                      memory: 320Mi
                    limits:
                      memory: 512Mi
        immich:
          persistence:
            library:
              existingClaim: immich-library
        valkey:
          enabled: true
          controllers:
            main:
              containers:
                main:
                  # Observed working set ~8Mi.
                  resources:
                    requests:
                      cpu: 25m
                      memory: 32Mi
                    limits:
                      memory: 128Mi
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
