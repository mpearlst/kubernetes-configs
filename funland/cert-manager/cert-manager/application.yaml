apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-application
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.1
    helm:
      valuesObject:
        crds:
          enabled: true
        # Requests added so the scheduler accounts for these pods. Prior to this
        # every chart-deployed workload here declared none, so nodes advertised
        # far more free memory than they had. Sized from measured working set.
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        cainjector:
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 320Mi
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true