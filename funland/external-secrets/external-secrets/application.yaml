apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-application
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.10.0
    helm:
      valuesObject:
        # Requests added so the scheduler accounts for these pods (they
        # previously declared none). Sized from measured working set.
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 192Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true